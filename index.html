:root{--bg:#f4f1ec;--ink:#17202c;--muted:#73808d;--card:rgba(255,255,255,.68);--line:rgba(23,32,44,.1);--accent:#e36b43;--accent2:#ecab5e;--good:#238b78;--shadow:0 18px 45px rgba(29,36,50,.11);--radius:24px;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 8% 2%,#ffcfaa 0,transparent 32%),radial-gradient(circle at 95% 22%,#bddbd1 0,transparent 29%),linear-gradient(135deg,#f9f6f0,#edf0ea)}body.dark{--bg:#0f1522;--ink:#eef2f4;--muted:#9aa8b5;--card:rgba(27,37,52,.74);--line:rgba(255,255,255,.11);--shadow:0 20px 55px rgba(0,0,0,.3);color-scheme:dark}body.dark:before{background:radial-gradient(circle at 15% 4%,#633c33 0,transparent 32%),radial-gradient(circle at 95% 20%,#183c42 0,transparent 33%),#0f1522}button,input,select,textarea{font:inherit;font-size:16px}button{border:0;cursor:pointer;min-height:44px;color:inherit}.app{max-width:900px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:800;color:var(--accent)}h1{font-size:30px;letter-spacing:-.06em;margin:4px 0 0}.top-actions{display:flex;gap:8px}.iconbtn,.pillbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:44px}.hero{padding:24px;border-radius:32px;color:#fff;background:linear-gradient(135deg,#182334,#31485a 57%,#db7248);box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:15px}.hero:after{content:"€";position:absolute;right:11px;top:-22px;font-size:160px;font-weight:900;color:rgba(255,255,255,.08);transform:rotate(12deg)}.hero-label{opacity:.72;font-size:13px}.hero h2{font-size:42px;letter-spacing:-.07em;margin:6px 0 20px;position:relative;z-index:1}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini-stats span{display:block;color:rgba(255,255,255,.62);font-size:11px}.mini-stats b{display:block;font-size:15px;margin-top:3px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 10px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.03em}.link{background:none;color:var(--accent);font-weight:700;font-size:13px}.people{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.debt,.activity,.empty{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);backdrop-filter:blur(18px)}.person{padding:15px;display:flex;gap:12px;align-items:center}.avatar{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--person) 20%,transparent)}.person strong{display:block;font-size:14px}.person small{color:var(--muted);font-size:11px}.person .amount{margin-left:auto;font-weight:800;font-size:14px}.bar{height:5px;border-radius:9px;background:var(--line);margin-top:10px;grid-column:1/-1;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--person);transition:width .7s ease}.analytics{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center;padding:17px}.donut{width:118px;height:118px;transform:rotate(-90deg)}.legend{display:grid;gap:9px}.legend div{font-size:12px;display:flex;gap:7px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:12px;padding-bottom:3px}.filters input,.filters select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:130px}.filters input{min-width:190px}.debt{padding:17px;margin-bottom:10px;animation:rise .35s both}.debt-top{display:flex;gap:10px;align-items:flex-start}.debt h3{margin:0 0 4px;font-size:15px}.debt p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.debt .due{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;margin-top:10px;border-radius:9px;background:rgba(227,107,67,.12);color:var(--accent);font-size:11px;font-weight:700}.debt-actions{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.smallbtn{background:none;color:var(--muted);font-size:12px;font-weight:700;padding:0 3px}.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.activity{padding:4px 15px}.activity-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.activity-row:last-child{border:0}.activity .circle{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:rgba(35,139,120,.14)}.activity strong{font-size:13px}.activity small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.activity em{margin-left:auto;font-style:normal;color:var(--good);font-weight:800;font-size:13px}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px}.tab{background:none;flex:1;max-width:120px;color:var(--muted);font-size:11px;font-weight:700;border-radius:14px}.tab.active{color:var(--accent);background:rgba(227,107,67,.1)}.tab b{display:block;font-size:20px;line-height:20px}.fab{position:fixed;right:20px;bottom:82px;width:58px;height:58px;border-radius:21px;background:var(--accent);color:white;font-size:26px;box-shadow:0 12px 25px rgba(227,107,67,.38);z-index:4;transition:transform .2s}.fab:active{transform:scale(.92)}.sheet-back{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.42);align-items:flex-end}.sheet-back.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:sheet .3s ease}.sheet h2{margin:0 0 16px;letter-spacing:-.04em}.handle{width:42px;height:5px;border-radius:8px;background:var(--line);margin:0 auto 18px}.formgrid{display:grid;gap:12px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--card);color:var(--ink)}.field textarea{min-height:80px;resize:vertical}.form-actions{display:flex;gap:10px;margin-top:18px}.primary{flex:1;border-radius:15px;background:var(--accent);color:white;font-weight:800}.secondary{border-radius:15px;background:var(--line);padding:0 18px}.hidden{display:none!important}.toast{position:fixed;z-index:20;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.settings-list{display:grid;gap:9px}.setting-row{display:flex;align-items:center;gap:10px;padding:13px 14px}.setting-row span{flex:1}.danger{color:#d55656}.material{color:#b46c16;background:rgba(236,171,94,.16)}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}@media(min-width:700px){.app{padding-left:30px;padding-right:30px}.fab{right:calc(50% - 420px)}.sheet{max-width:560px;margin:auto;border-radius:28px}.sheet-back{align-items:center}}
@media print{body,body:before{background:#fff!important;color:#111!important}.tabs,.fab,.top-actions,.filters,.debt-actions,.sheet-back{display:none!important}.app{padding:15px}.card,.debt,.activity,.hero{box-shadow:none;border:1px solid #ddd;background:#fff;color:#111}.hero{background:#eee!important}.hero h2{color:#111}.section-head{margin-top:18px}}

<body><main class="app"><header class="top"><div><div class="eyebrow">Carnet familial</div><h1>Dette claire <span aria-hidden="true">✦</span></h1></div><div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="Changer de thème">☾</button><button class="iconbtn" id="settingsBtn" aria-label="Réglages">⚙</button></div></header>
<section class="hero"><div class="hero-label">Reste à rembourser</div><h2 id="remaining">0,00 €</h2><div class="mini-stats"><div><span>Total dû</span><b id="total">0,00 €</b></div><div><span>Remboursé</span><b id="paid">0,00 €</b></div><div><span>Opérations</span><b id="ops">0</b></div></div></section>
<section class="section-head"><h2>Par créancier</h2><button class="link" id="managePeople">Gérer</button></section><div class="people" id="people"></div>
<section class="section-head"><h2>Répartition</h2></section><div class="card analytics"><svg class="donut" id="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="7"/></svg><div class="legend" id="legend"></div></div>
<section class="section-head"><h2>Dettes</h2><button class="link" id="clearFilters">Réinitialiser</button></section><div class="filters"><input id="search" placeholder="⌕  Rechercher…"><select id="personFilter"><option value="">Personne</option></select><select id="catFilter"><option value="">Catégorie</option></select><select id="typeFilter"><option value="">Type</option><option value="debt">Dette</option><option value="payment">Remboursement</option></select></div><div id="debts"></div>
<section class="section-head"><h2>Activité récente</h2><button class="link" id="addPayment">+ Remboursement</button></section><div class="activity" id="activity"></div></main>
<nav class="tabs"><button class="tab active"><b>⌂</b>Accueil</button><button class="tab" id="tabDebts"><b>▤</b>Dettes</button><button class="tab" id="tabPay"><b>↗</b>Payer</button><button class="tab" id="tabSettings"><b>⋯</b>Plus</button></nav><button class="fab" id="addDebt" aria-label="Ajouter une dette">＋</button><div class="toast" id="toast"></div>
<div class="sheet-back" id="sheetBack"><section class="sheet" role="dialog"><div class="handle"></div><div id="sheetContent"></div></section></div>
<script>
'use strict';
const KEY='dette-claire-v1'; const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n)||0); const dateFR=d=>new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00')); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2); const starter={people:[{id:'papa',name:'Papa & Maman',emoji:'🏡',color:'#e36b43'},{id:'mamie',name:'Grand-mère',emoji:'🌼',color:'#8b78ce'}],categories:[],debts:[],payments:[],theme:'auto'}; let data=load(); function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');return saved?{...starter,...saved,people:saved.people||starter.people,categories:saved.categories||[],debts:saved.debts||[],payments:saved.payments||[]}:JSON.parse(JSON.stringify(starter))}catch{return JSON.parse(JSON.stringify(starter))}} function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
const $=s=>document.querySelector(s); const person=id=>data.people.find(p=>p.id===id); const cat=id=>data.categories.find(c=>c.id===id); const sum=a=>a.reduce((x,y)=>x+Number(y.amount||0),0); function paymentsFor(did){return data.payments.filter(p=>p.debtId===did)} function paidFor(d){return sum(paymentsFor(d.id))} function debtLeft(d){return Math.max(0,Number(d.amount)-paidFor(d))} function allPaid(){return sum(data.payments)}
function render(){const total=sum(data.debts),paid=allPaid(); $('#total').textContent=euro(total);$('#paid').textContent=euro(paid);$('#remaining').textContent=euro(Math.max(0,total-paid));$('#ops').textContent=data.debts.length+data.payments.length; renderPeople();renderCats();renderDebts();renderActivity()}
function renderPeople(){let total=sum(data.debts);$('#people').innerHTML=data.people.map(p=>{let d=sum(data.debts.filter(x=>x.personId===p.id)), r=sum(data.payments.filter(x=>x.personId===p.id)), left=Math.max(0,d-r), pct=d?Math.min(100,r/d*100):0;return `<div class="card person" style="--person:${esc(p.color)}"><div class="avatar">${esc(p.emoji)}</div><div><strong>${esc(p.name)}</strong><small>${d?Math.round(pct)+'% remboursé':'Aucune dette'}</small></div><div class="amount">${euro(left)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="empty">Aucun créancier</div>'}
function renderCats(){let vals={};data.debts.forEach(d=>vals[d.categoryId||'none']=(vals[d.categoryId||'none']||0)+Number(d.amount));let entries=Object.entries(vals).sort((a,b)=>b[1]-a[1]);let total=sum(entries.map(x=>x[1])),colors=['#e36b43','#238b78','#8b78ce','#e5aa4c','#4f8cc9'];let circ=100, off=0;let circles=entries.map((e,i)=>{let len=total?e[1]/total*100:0,s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${colors[i%colors.length]}" stroke-width="7" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('');$('#donut').innerHTML='<circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="7"/>'+circles;$('#legend').innerHTML=entries.length?entries.slice(0,5).map((e,i)=>`<div><i class="dot" style="background:${colors[i%colors.length]}"></i>${esc(cat(e[0])?.name||'Sans catégorie')} <b>${euro(e[1])}</b></div>`).join(''):'<span style="color:var(--muted);font-size:12px">Ajoutez une dette pour voir la répartition.</span>'}
function filtered(){let q=$('#search').value.toLowerCase(),p=$('#personFilter').value,c=$('#catFilter').value,t=$('#typeFilter').value;return data.debts.filter(d=>(!q||[d.description,d.note,person(d.personId)?.name].join(' ').toLowerCase().includes(q))&&(!p||d.personId===p)&&(!c||d.categoryId===c)&&(!t||t==='debt'))}
function renderDebts(){let ps=$('#personFilter'),cs=$('#catFilter');ps.innerHTML='<option value="">Personne</option>'+data.people.map(p=>`<option value="${p.id}">${esc(p.emoji)} ${esc(p.name)}</option>`).join('');cs.innerHTML='<option value="">Catégorie</option>'+data.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');let list=filtered();$('#debts').innerHTML=list.length?list.map(d=>{let p=person(d.personId),c=cat(d.categoryId),left=debtLeft(d);return `<article class="debt"><div class="debt-top"><div class="avatar" style="--person:${esc(p?.color||'#aaa')}">${esc(p?.emoji||'💬')}</div><div><h3>${esc(d.description||'Dette sans titre')}</h3><p>${esc(p?.name||'')} · ${esc(dateFR(d.date))}</p></div><div class="due">${euro(left)}<p>sur ${euro(d.amount)}</p></div></div>${c?`<span class="tag"># ${esc(c.name)}</span>`:''}${d.note?`<p style="margin-top:10px">${esc(d.note)}</p>`:''}<div class="debt-actions"><button class="smallbtn" data-edit="${d.id}">Modifier</button><button class="smallbtn" data-pay-debt="${d.id}">Rembourser</button><button class="smallbtn danger" data-del="${d.id}">Supprimer</button></div></article>`}).join(''):'<div class="empty"><b>Votre carnet est calme</b>Ajoutez votre première dette avec le bouton +.</div>'}
function renderActivity(){let a=[...data.payments].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6);$('#activity').innerHTML=a.length?a.map(x=>`<div class="activity-row"><div class="circle">${x.kind==='materials'?'🧱':'€'}</div><div><strong>${esc(person(x.personId)?.name||'')} · ${x.kind==='materials'?'Matériaux':'Argent'}</strong><small>${esc(dateFR(x.date))}${x.materials?' · '+esc(x.materials):''}</small></div><em>− ${euro(x.amount)}</em></div>`).join(''):'<div class="empty" style="box-shadow:none;border:0;background:none">Vos remboursements apparaîtront ici.</div>'}
function openSheet(content){$('#sheetContent').innerHTML=content;$('#sheetBack').classList.add('open')}function closeSheet(){$('#sheetBack').classList.remove('open')}$('#sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});
function debtForm(id){let d=data.debts.find(x=>x.id===id)||{personId:data.people[0]?.id,categoryId:'',description:'',amount:'',date:new Date().toISOString().slice(0,10),note:''};openSheet(`<h2>${id?'Modifier':'Nouvelle'} dette</h2><form id="debtForm"><div class="formgrid"><div class="field"><label>Créancier</label><select name="personId" required>${data.people.map(p=>`<option value="${p.id}" ${p.id===d.personId?'selected':''}>${esc(p.emoji)} ${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Description</label><input name="description" required placeholder="Ex. billet de train" value="${esc(d.description)}"></div><div class="field"><label>Montant (€)</label><input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required value="${esc(d.amount)}"></div><div class="field"><label>Catégorie</label><select name="categoryId"><option value="">Sans catégorie</option>${data.categories.map(c=>`<option value="${c.id}" ${c.id===d.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input name="date" type="date" value="${d.date}"></div><div class="field"><label>Note (optionnel)</label><textarea name="note" placeholder="Un détail à retenir…">${esc(d.note)}</textarea></div></div><div class="form-actions"><button type="button" class="secondary" id="cancel">Annuler</button><button class="primary">Enregistrer</button></div></form>`);$('#cancel').onclick=closeSheet;$('#debtForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.amount=Number(o.amount);if(id)Object.assign(data.debts.find(x=>x.id===id),o);else data.debts.push({id:uid(),...o});save();closeSheet();toast('Dette enregistrée')};}
function paymentForm(debtId){let d=data.debts.find(x=>x.id===debtId),p=d?.personId||data.people[0]?.id;openSheet(`<h2>Nouveau remboursement</h2><form id="payForm"><div class="formgrid"><div class="field"><label>Créancier</label><select name="personId" required>${data.people.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${esc(x.emoji)} ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Montant (€)</label><input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" max="${d?debtLeft(d):''}" required></div><div class="field"><label>Dette liée (optionnel)</label><select name="debtId"><option value="">Aucune dette précise</option>${data.debts.filter(x=>debtLeft(x)>0).map(x=>`<option value="${x.id}" ${x.id===debtId?'selected':''}>${esc(x.description)} · ${euro(debtLeft(x))}</option>`).join('')}</select></div><div class="field"><label>Type</label><select name="kind" id="kind"><option value="money">Argent</option><option value="materials">Achat de matériaux</option></select></div><div class="field hidden" id="materialsField"><label>Description des matériaux</label><input name="materials" placeholder="Ex. peinture, visserie…"></div><div class="field"><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="form-actions"><button type="button" class="secondary" id="cancel">Annuler</button><button class="primary">Enregistrer</button></div></form>`);$('#cancel').onclick=closeSheet;$('#kind').onchange=e=>$('#materialsField').classList.toggle('hidden',e.target.value!=='materials');$('#payForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.amount=Number(o.amount);data.payments.push({id:uid(),...o});save();closeSheet();toast('Remboursement ajouté')};}
function peopleSheet(){openSheet(`<h2>Créanciers</h2><div class="settings-list">${data.people.map(p=>`<div class="card setting-row"><span>${esc(p.emoji)} ${esc(p.name)}</span><button class="smallbtn" data-rename="${p.id}">Renommer</button><button class="smallbtn danger" data-remove-person="${p.id}">Suppr.</button></div>`).join('')}</div><div class="form-actions"><button class="primary" id="newPerson">＋ Ajouter un créancier</button></div>`);$('#newPerson').onclick=()=>{let n=prompt('Nom du créancier');if(n){data.people.push({id:uid(),name:n,emoji:'👤',color:'#4f8cc9'});save();peopleSheet()}}}
function settings(){openSheet(`<h2>Réglages</h2><div class="settings-list"><div class="card setting-row"><span>Thème sombre</span><button class="pillbtn" id="darkToggle">${document.body.classList.contains('dark')?'☀':'☾'}</button></div><div class="card setting-row"><span>Catégories</span><button class="smallbtn" id="categories">Gérer</button></div><div class="card setting-row"><span>Exporter les données</span><button class="smallbtn" id="export">JSON</button></div><div class="card setting-row"><span>Importer un JSON</span><button class="smallbtn" id="import">Choisir</button><input type="file" id="file" accept="application/json" class="hidden"></div><div class="card setting-row"><span class="danger">Réinitialiser le carnet</span><button class="smallbtn danger" id="reset">Effacer</button></div></div>`);$('#darkToggle').onclick=()=>{data.theme=document.body.classList.contains('dark')?'light':'dark';applyTheme();save();settings()};$('#categories').onclick=categoriesSheet;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='dette-claire.json';a.click()};$('#import').onclick=()=>$('#file').click();$('#file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{data={...starter,...JSON.parse(r.result)};save();closeSheet();toast('Données importées')}catch{toast('Fichier JSON invalide')}};r.readAsText(e.target.files[0])};$('#reset').onclick=()=>{if(confirm('Effacer toutes les dettes et remboursements ?')){data={...starter,people:starter.people.map(x=>({...x})),categories:[]};save();closeSheet();toast('Carnet réinitialisé')}}}
function categoriesSheet(){openSheet(`<h2>Catégories</h2><p style="color:var(--muted);font-size:13px">Ajoutez uniquement celles qui vous sont utiles.</p><div class="settings-list">${data.categories.map(c=>`<div class="card setting-row"><span># ${esc(c.name)}</span><button class="smallbtn danger" data-del-cat="${c.id}">Suppr.</button></div>`).join('')}</div><div class="form-actions"><button class="primary" id="newCat">＋ Ajouter une catégorie</button></div>`);$('#newCat').onclick=()=>{let n=prompt('Nom de la catégorie');if(n){data.categories.push({id:uid(),name:n});save();categoriesSheet()}}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}function applyTheme(){let dark=data.theme==='dark'||(data.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark)}
document.addEventListener('click',e=>{let t=e.target;if(t.dataset.edit)debtForm(t.dataset.edit);if(t.dataset.payDebt)paymentForm(t.dataset.payDebt);if(t.dataset.del&&confirm('Supprimer cette dette ?')){data.debts=data.debts.filter(x=>x.id!==t.dataset.del);data.payments=data.payments.filter(x=>x.debtId!==t.dataset.del);save();toast('Dette supprimée')}if(t.dataset.rename){let p=person(t.dataset.rename),n=prompt('Nouveau nom',p.name);if(n){p.name=n;save();peopleSheet()}}if(t.dataset.removePerson&&data.debts.some(x=>x.personId===t.dataset.removePerson)){toast('Impossible : ce créancier a des dettes')}else if(t.dataset.removePerson){data.people=data.people.filter(x=>x.id!==t.dataset.removePerson);save();peopleSheet()}if(t.dataset.delCat){data.categories=data.categories.filter(x=>x.id!==t.dataset.delCat);save();categoriesSheet()}});
$('#addDebt').onclick=()=>debtForm();$('#addPayment').onclick=()=>paymentForm();$('#managePeople').onclick=peopleSheet;$('#settingsBtn').onclick=settings;$('#tabSettings').onclick=settings;$('#themeBtn').onclick=()=>{data.theme=document.body.classList.contains('dark')?'light':'dark';applyTheme();save()};$('#tabPay').onclick=()=>paymentForm();$('#tabDebts').onclick=()=>$('#search').focus();['search','personFilter','catFilter','typeFilter'].forEach(id=>$('#'+id).addEventListener('input',renderDebts));$('#clearFilters').onclick=()=>{['search','personFilter','catFilter','typeFilter'].forEach(id=>$('#'+id).value='');renderDebts()};applyTheme();render();
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
