-size:42px;letter-spacing:-.07em;margin:6px 0 20px;position:relative;z-index:1}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini-stats span{display:block;color:rgba(255,255,255,.62);font-size:11px}.mini-stats b{display:block;font-size:15px;margin-top:3px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 10px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.03em}.link{background:none;color:var(--accent);font-weight:700;font-size:13px}.people{display:grid;grid-template-columns:1fr;gap:12px}.card,.debt,.activity,.empty{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);backdrop-filter:blur(18px)}.person{padding:15px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}.person > div:nth-child(2){min-width:0}.person strong,.person small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.avatar{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--person) 20%,transparent)}.person strong{display:block;font-size:14px}.person small{color:var(--muted);font-size:11px}.person .amount{margin-left:auto;font-weight:800;font-size:14px}.bar{height:5px;border-radius:9px;background:var(--line);margin-top:10px;grid-column:1/-1;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--person);transition:width .7s ease}.analytics{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center;padding:17px}.donut{width:118px;height:118px;overflow:visible}.donut-segment{transition:stroke-dasharray .65s ease,stroke-dashoffset .65s ease}.donut-total{font-size:3.8px;font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.legend{display:grid;gap:9px}.legend div{font-size:12px;display:flex;gap:7px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;padding-bottom:3px}.filters input,.filters select{width:100%;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 12px}.filters input{grid-column:1/-1}.debt{padding:17px;margin-bottom:10px;animation:rise .35s both}.debt-top{display:flex;gap:10px;align-items:flex-start}.debt h3{margin:0 0 4px;font-size:15px}.debt p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.debt .due{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}.debt .due-label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}.debt .due-sub{display:block;font-size:11px;color:var(--muted);font-weight:600}.debt .progress{height:5px;border-radius:9px;background:var(--line);margin-top:13px;overflow:hidden}.debt .progress i{display:block;height:100%;border-radius:9px;background:var(--good);transition:width .7s ease}.debt.settled{opacity:.66}.debt.settled .progress i{background:var(--good)}.settled-badge{display:inline-flex;align-items:center;padding:5px 8px;margin-top:10px;border-radius:9px;background:rgba(35,139,120,.14);color:var(--good);font-size:11px;font-weight:800}.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;margin-top:10px;border-radius:9px;background:rgba(227,107,67,.12);color:var(--accent);font-size:11px;font-weight:700}.debt-actions{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.smallbtn{background:none;color:var(--muted);font-size:12px;font-weight:700;padding:0 3px}.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.activity{padding:4px 15px}.activity-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}.activity-row > div:nth-child(2){min-width:0;overflow:hidden}.activity-row strong,.activity-row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity em{margin-left:auto;font-style:normal;color:var(--good);font-weight:800;font-size:13px;white-space:nowrap;flex-shrink:0}.activity-row:last-child{border:0}.activity .circle{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:rgba(35,139,120,.14)}.activity strong{font-size:13px}.activity small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.activity em{margin-left:auto;font-style:normal;color:var(--good);font-weight:800;font-size:13px}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px}.tab{background:none;flex:1;max-width:120px;color:var(--muted);font-size:11px;font-weight:700;border-radius:14px}.tab.active{color:var(--accent);background:rgba(227,107,67,.1)}.tab b{display:block;font-size:20px;line-height:20px}.fab{position:fixed;right:20px;bottom:82px;width:58px;height:58px;border-radius:21px;background:var(--accent);color:white;font-size:26px;box-shadow:0 12px 25px rgba(227,107,67,.38);z-index:4;transition:transform .2s}.fab:active{transform:scale(.92)}.sheet-back{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.42);align-items:flex-end}.sheet-back.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:sheet .3s ease}.sheet h2{margin:0 0 16px;letter-spacing:-.04em}.handle{width:42px;height:5px;border-radius:8px;background:var(--line);margin:0 auto 18px}.formgrid{display:grid;gap:12px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--card);color:var(--ink)}.field textarea{min-height:80px;resize:vertical}.form-actions{display:flex;gap:10px;margin-top:18px}.primary{flex:1;border-radius:15px;background:var(--accent);color:white;font-weight:800}.secondary{border-radius:15px;background:var(--line);padding:0 18px}.hidden{display:none!important}.toast{position:fixed;z-index:20;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.settings-list{display:grid;gap:9px}.setting-row{display:flex;align-items:center;gap:10px;padding:13px 14px}.setting-row span{flex:1}.danger{color:#d55656}.material{color:#b46c16;background:rgba(236,171,94,.16)}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}@media(min-width:700px){.app{padding-left:30px;padding-right:30px}.fab{right:calc(50% - 420px)}.sheet{max-width:560px;margin:auto;border-radius:28px}.sheet-back{align-items:center}}
@media print{body,body:before{background:#fff!important;color:#111!important}.tabs,.fab,.top-actions,.filters,.debt-actions,.sheet-back{display:none!important}.app{padding:15px}.card,.debt,.activity,.hero{box-shadow:none;border:1px solid #ddd;background:#fff;color:#111}.hero{background:#eee!important}.hero h2{color:#111}.section-head{margin-top:18px}}

.hero{background-size:180% 180%;animation:heroShift 12s ease-in-out infinite alternate}.hero:before{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.16) 49%,transparent 56%);transform:translateX(-70%) rotate(8deg);animation:shine 8s ease-in-out infinite;pointer-events:none}.hero>*{position:relative;z-index:1}
.card,.debt,.activity,.empty{will-change:transform,opacity}.reveal{opacity:1;transform:none}.reveal.in{opacity:1;transform:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s ease}.debt.removing{opacity:0;transform:translateY(-8px) scale(.96);max-height:0;margin:0;padding-top:0;padding-bottom:0;overflow:hidden;transition:all .35s ease}.progress i,.bar i{transition:width .8s cubic-bezier(.22,1,.36,1)}
.tab{position:relative;transition:color .25s ease,transform .2s ease}.tab:after{content:"";position:absolute;left:25%;right:25%;bottom:3px;height:3px;border-radius:9px;background:var(--accent);transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.tab.active:after{transform:scaleX(1)}.tab.active{background:transparent}.sheet-back{opacity:0;visibility:hidden;transition:opacity .25s ease;backdrop-filter:blur(0)}.sheet-back.open{opacity:1;visibility:visible;backdrop-filter:blur(9px)}.sheet{animation:sheetSpring .5s cubic-bezier(.18,.89,.32,1.18)}.sheet-back.dragging .sheet{transition:none}.toast{transform:translate(-50%,12px);transition:opacity .25s ease,transform .25s ease}.toast.show{transform:translate(-50%,0)}.pressable{transition:transform .16s ease}.pressable:active{transform:scale(.95)}/* Pulse halo removed: it was clipped/offset on iOS Safari and made the FAB look displaced. */.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .55s ease-out;pointer-events:none}.confetti{position:fixed;z-index:50;width:8px;height:13px;pointer-events:none;animation:confetti 900ms cubic-bezier(.2,.8,.3,1) forwards}

<body><main class="app"><header class="top"><div><div class="eyebrow">Carnet familial</div><h1>Dette claire <span aria-hidden="true">✦</span></h1></div><div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="Changer de thème">☾</button><button class="iconbtn" id="settingsBtn" aria-label="Réglages">⚙</button></div></header>
<section class="hero"><div class="hero-label">Reste à rembourser</div><h2 id="remaining">0,00 €</h2><div class="mini-stats"><div><span>Total dû</span><b id="total">0,00 €</b></div><div><span>Remboursé</span><b id="paid">0,00 €</b></div><div><span>Opérations</span><b id="ops">0</b></div></div></section>
<section class="section-head"><h2>Par créancier</h2><button class="link" id="managePeople">Gérer</button></section><div class="people" id="people"></div>
<section class="section-head"><h2>Répartition</h2></section><div class="card analytics"><svg class="donut" id="donut" viewBox="0 0 42 42" role="img" aria-label="Répartition des dettes"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="7" pathLength="100"/><g id="donutSegments" transform="rotate(-90 21 21)"></g><text id="donutTotal" class="donut-total" x="21" y="21">0 €</text></svg><div class="legend" id="legend"></div></div>
<section class="section-head"><h2>Dettes</h2><button class="link" id="clearFilters">Effacer les filtres</button></section><div class="filters"><input id="search" placeholder="⌕  Rechercher…"><select id="personFilter"><option value="">Personne</option></select><select id="catFilter"><option value="">Catégorie</option></select></div><div id="debts"></div>
<section class="section-head"><h2>Activité récente</h2><button class="link" id="addPayment">+ Remboursement</button></section><div class="activity" id="activity"></div></main>
<nav class="tabs"><button class="tab active"><b>⌂</b>Accueil</button><button class="tab" id="tabDebts"><b>▤</b>Dettes</button><button class="tab" id="tabPay"><b>↗</b>Payer</button><button class="tab" id="tabSettings"><b>⋯</b>Plus</button></nav><button class="fab" id="addDebt" aria-label="Ajouter une dette">＋</button><div class="toast" id="toast"></div>
<div class="sheet-back" id="sheetBack"><section class="sheet" role="dialog"><div class="handle"></div><div id="sheetContent"></div></section></div>
<script>
'use strict';
const KEY='dette-claire-v1'; const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n)||0); const dateFR=d=>new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00')); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2); const starter={people:[{id:'papa',name:'Papa & Maman',emoji:'🏡',color:'#E46A3F'},{id:'mamie',name:'Grand-mère',emoji:'🌼',color:'#8b78ce'}],categories:[],debts:[],payments:[],theme:'auto'}; let data=load(); function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');return saved?{...starter,...saved,people:saved.people||starter.people,categories:saved.categories||[],debts:saved.debts||[],payments:saved.payments||[]}:JSON.parse(JSON.stringify(starter))}catch{return JSON.parse(JSON.stringify(starter))}} function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
const $=s=>document.querySelector(s); const person=id=>data.people.find(p=>p.id===id); const cat=id=>data.categories.find(c=>c.id===id); const sum=a=>a.reduce((x,y)=>x+Number(y.amount||0),0); function paymentsFor(did){return data.payments.filter(p=>p.debtId===did)} function paidFor(d){return sum(paymentsFor(d.id))} function debtLeft(d){return Math.max(0,Number(d.amount)-paidFor(d))} function allPaid(){return sum(data.payments)}
function render(){const total=sum(data.debts),paid=allPaid(); $('#total').textContent=euro(total);$('#paid').textContent=euro(paid);$('#remaining').textContent=euro(Math.max(0,total-paid));$('#ops').textContent=data.debts.length+data.payments.length; renderPeople();renderCats();renderDebts();renderActivity()}
function renderPeople(){let total=sum(data.debts);$('#people').innerHTML=data.people.map(p=>{let d=sum(data.debts.filter(x=>x.personId===p.id)), r=sum(data.payments.filter(x=>x.personId===p.id)), left=Math.max(0,d-r), pct=d?Math.min(100,r/d*100):0;return `<div class="card person" style="--person:${esc(p.color)}"><div class="avatar">${esc(p.emoji)}</div><div><strong>${esc(p.name)}</strong><small>${d?Math.round(pct)+'% remboursé':'Aucune dette'}</small></div><div class="amount">${euro(left)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="empty">Aucun créancier</div>'}
function renderCats(){
  const vals={};
  filtered().forEach(d=>{const key=d.categoryId||'none';vals[key]=(vals[key]||0)+Number(d.amount||0)});
  const entries=Object.entries(vals).sort((a,b)=>b[1]-a[1]);
  const visibleEntries=entries.slice(0,5),total=visibleEntries.reduce((acc,e)=>acc+Number(e[1]||0),0),colors=['#E46A3F','#238b78','#8b78ce','#e5aa4c','#4f8cc9'];
  const svg=$('#donut'),segments=$('#donutSegments');
  segments.innerHTML='';
  $('#donutTotal').textContent=euro(total).replace(/\u00a0/g,' ');
  let offset=0;
  visibleEntries.forEach((e,i)=>{
    const length=total?e[1]/total*100:0;
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('class','donut-segment');circle.setAttribute('cx','21');circle.setAttribute('cy','21');circle.setAttribute('r','15.9');circle.setAttribute('fill','none');circle.setAttribute('stroke',colors[i%colors.length]);circle.setAttribute('stroke-width','7');circle.setAttribute('pathLength','100');circle.setAttribute('stroke-dasharray',`${length} ${100-length}`);circle.setAttribute('stroke-dashoffset',String(-offset));
    segments.appendChild(circle);
    offset+=length;
  });
  svg.setAttribute('aria-label',entries.length?`Répartition des dettes, total ${euro(total)}`:'Aucune dette');
  $('#legend').innerHTML=visibleEntries.length?visibleEntries.map((e,i)=>`<div><i class="dot" style="background:${colors[i%colors.length]}"></i>${esc(cat(e[0])?.name||'Sans catégorie')} <b>${euro(e[1])}</b></div>`).join(''):'<span style="color:var(--muted);font-size:12px">Ajoutez une dette pour voir la répartition.</span>'
}
function filtered(){let q=$('#search').value.toLowerCase(),p=$('#personFilter').value,c=$('#catFilter').value;return data.debts.filter(d=>(!q||[d.description,d.note,person(d.personId)?.name].join(' ').toLowerCase().includes(q))&&(!p||d.personId===p)&&(!c||d.categoryId===c))}
function renderDebts(){let ps=$('#personFilter'),cs=$('#catFilter');ps.innerHTML='<option value="">Personne</option>'+data.people.map(p=>`<option value="${p.id}">${esc(p.emoji)} ${esc(p.name)}</option>`).join('');cs.innerHTML='<option value="">Catégorie</option>'+data.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');let list=filtered().sort((a,b)=>(debtLeft(a)<=0)-(debtLeft(b)<=0));$('#debts').innerHTML=list.length?list.map(d=>{let p=person(d.personId),c=cat(d.categoryId),amount=Number(d.amount)||0,left=debtLeft(d),pct=amount?Math.min(100,Math.max(0,(amount-left)/amount*100)):0,settled=left<=0;return `<article class="debt${settled?' settled':''}"><div class="debt-top"><div class="avatar" style="--person:${esc(p?.color||'#aaa')}">${esc(p?.emoji||'💬')}</div><div><h3>${esc(d.description||'Dette sans titre')}</h3><p>${esc(p?.name||'')} · ${esc(dateFR(d.date))}</p></div><div class="due"><span class="due-label">Reste ${euro(left)}</span><span class="due-sub">sur ${euro(amount)}</span></div></div>${settled?'<span class="settled-badge">Soldé ✓</span>':''}${c?`<span class="tag"># ${esc(c.name)}</span>`:''}${d.note?`<p style="margin-top:10px">${esc(d.note)}</p>`:''}<div class="progress" aria-label="${Math.round(pct)} % remboursé"><i style="width:${pct}%"></i></div><div class="debt-actions"><button class="smallbtn" data-edit="${d.id}">Modifier</button><button class="smallbtn" data-pay-debt="${d.id}">Rembourser</button><button class="smallbtn danger" data-del="${d.id}">Supprimer</button></div></article>`}).join(''):'<div class="empty"><b>Votre carnet est calme</b>Ajoutez votre première dette avec le bouton +.</div>'}
function renderActivity(){let a=[...data.payments].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6);$('#activity').innerHTML=a.length?a.map(x=>`<div class="activity-row"><div class="circle">${x.kind==='materials'?'🧱':'€'}</div><div><strong>${esc(person(x.personId)?.name||'')}${x.debtId&&data.debts.find(d=>d.id===x.debtId)?' · '+esc(data.debts.find(d=>d.id===x.debtId).description||'Dette sans titre'):' · '+(x.kind==='materials'?'Matériaux':'Argent')}</strong><small>${esc(dateFR(x.date))}${x.materials?' · '+esc(x.materials):''}</small></div><em>− ${euro(x.amount)}</em></div>`).join(''):'<div class="empty" style="box-shadow:none;border:0;background:none">Vos remboursements apparaîtront ici.</div>'}
function openSheet(content){$('#sheetContent').innerHTML=content;$('#sheetBack').classList.add('open')}function closeSheet(){$('#sheetBack').classList.remove('open')}$('#sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});
function debtForm(id){let d=data.debts.find(x=>x.id===id)||{personId:data.people[0]?.id,categoryId:'',description:'',amount:'',date:new Date().toISOString().slice(0,10),note:''};openSheet(`<h2>${id?'Modifier':'Nouvelle'} dette</h2><form id="debtForm"><div class="formgrid"><div class="field"><label>Créancier</label><select name="personId" required>${data.people.map(p=>`<option value="${p.id}" ${p.id===d.personId?'selected':''}>${esc(p.emoji)} ${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Description</label><input name="description" required placeholder="Ex. billet de train" value="${esc(d.description)}"></div><div class="field"><label>Montant (€)</label><input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required value="${esc(d.amount)}"></div><div class="field"><label>Catégorie</label><select name="categoryId"><option value="">Sans catégorie</option>${data.categories.map(c=>`<option value="${c.id}" ${c.id===d.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input name="date" type="date" value="${d.date}"></div><div class="field"><label>Note (optionnel)</label><textarea name="note" placeholder="Un détail à retenir…">${esc(d.note)}</textarea></div></div><div class="form-actions"><button type="button" class="secondary" id="cancel">Annuler</button><button class="primary">Enregistrer</button></div></form>`);$('#cancel').onclick=closeSheet;$('#debtForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.amount=Number(o.amount);if(id)Object.assign(data.debts.find(x=>x.id===id),o);else data.debts.push({id:uid(),...o});save();closeSheet();toast('Dette enregistrée')};}
function paymentForm(debtId){let d=data.debts.find(x=>x.id===debtId),p=d?.personId||data.people[0]?.id;openSheet(`<h2>Nouveau remboursement</h2><form id="payForm"><div class="formgrid"><div class="field"><label>Créancier</label><select name="personId" required>${data.people.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${esc(x.emoji)} ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Montant (€)</label><input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" max="${d?debtLeft(d):''}" required></div><div class="field"><label>Dette liée (optionnel)</label><select name="debtId"><option value="">Aucune dette précise</option>${data.debts.filter(x=>x.personId===p&&debtLeft(x)>0).map(x=>`<option value="${x.id}" ${x.id===debtId?'selected':''}>${esc(x.description)} · ${euro(debtLeft(x))}</option>`).join('')}</select></div><div class="field"><label>Type</label><select name="kind" id="kind"><option value="money">Argent</option><option value="materials">Achat de matériaux</option></select></div><div class="field hidden" id="materialsField"><label>Description des matériaux</label><input name="materials" placeholder="Ex. peinture, visserie…"></div><div class="field"><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="form-actions"><button type="button" class="secondary" id="cancel">Annuler</button><button class="primary">Enregistrer</button></div></form>`);$('#cancel').onclick=closeSheet;$('#payForm [name=personId]').onchange=e=>{let sel=$('#payForm [name=debtId]'),current=sel.value;sel.innerHTML='<option value="">Aucune dette précise</option>'+data.debts.filter(x=>x.personId===e.target.value&&debtLeft(x)>0).map(x=>`<option value="${x.id}">${esc(x.description)} · ${euro(debtLeft(x))}</option>`).join('');if([...sel.options].some(o=>o.value===current))sel.value=current};$('#kind').onchange=e=>$('#materialsField').classList.toggle('hidden',e.target.value!=='materials');$('#payForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.amount=Number(o.amount);data.payments.push({id:uid(),...o});save();closeSheet();toast('Remboursement ajouté')};}
function peopleSheet(){openSheet(`<h2>Créanciers</h2><div class="settings-list">${data.people.map(p=>`<div class="card setting-row"><span>${esc(p.emoji)} ${esc(p.name)}</span><button class="smallbtn" data-rename="${p.id}">Renommer</button><button class="smallbtn danger" data-remove-person="${p.id}">Suppr.</button></div>`).join('')}</div><div class="form-actions"><button class="primary" id="newPerson">＋ Ajouter un créancier</button></div>`);$('#newPerson').onclick=()=>{let n=prompt('Nom du créancier');if(n){data.people.push({id:uid(),name:n,emoji:'👤',color:'#4f8cc9'});save();peopleSheet()}}}
function settings(){openSheet(`<h2>Réglages</h2><div class="settings-list"><div class="card setting-row"><span>Thème sombre</span><button class="pillbtn" id="darkToggle">${document.body.classList.contains('dark')?'☀':'☾'}</button></div><div class="card setting-row"><span>Catégories</span><button class="smallbtn" id="categories">Gérer</button></div><div class="card setting-row"><span>Exporter les données</span><button class="smallbtn" id="export">JSON</button></div><div class="card setting-row"><span>Importer un JSON</span><button class="smallbtn" id="import">Choisir</button><input type="file" id="file" accept="application/json" class="hidden"></div><div class="card setting-row"><span class="danger">Réinitialiser le carnet</span><button class="smallbtn danger" id="reset">Effacer</button></div></div>`);$('#darkToggle').onclick=()=>{data.theme=document.body.classList.contains('dark')?'light':'dark';applyTheme();save();settings()};$('#categories').onclick=categoriesSheet;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='dette-claire.json';a.click()};$('#import').onclick=()=>$('#file').click();$('#file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{data={...starter,...JSON.parse(r.result)};save();closeSheet();toast('Données importées')}catch{toast('Fichier JSON invalide')}};r.readAsText(e.target.files[0])};$('#reset').onclick=()=>{if(confirm('Effacer toutes les dettes et remboursements ?')){data={...starter,people:starter.people.map(x=>({...x})),categories:[]};save();closeSheet();toast('Carnet réinitialisé')}}}
function categoriesSheet(){openSheet(`<h2>Catégories</h2><p style="color:var(--muted);font-size:13px">Ajoutez uniquement celles qui vous sont utiles.</p><div class="settings-list">${data.categories.map(c=>`<div class="card setting-row"><span># ${esc(c.name)}</span><button class="smallbtn danger" data-del-cat="${c.id}">Suppr.</button></div>`).join('')}</div><div class="form-actions"><button class="primary" id="newCat">＋ Ajouter une catégorie</button></div>`);$('#newCat').onclick=()=>{let n=prompt('Nom de la catégorie');if(n){data.categories.push({id:uid(),name:n});save();categoriesSheet()}}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}function applyTheme(){let dark=data.theme==='dark'||(data.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark)}
document.addEventListener('click',e=>{let t=e.target;if(t.dataset.edit)debtForm(t.dataset.edit);if(t.dataset.payDebt)paymentForm(t.dataset.payDebt);if(t.dataset.del&&confirm('Supprimer cette dette ?')){data.debts=data.debts.filter(x=>x.id!==t.dataset.del);data.payments=data.payments.filter(x=>x.debtId!==t.dataset.del);save();toast('Dette supprimée')}if(t.dataset.rename){let p=person(t.dataset.rename),n=prompt('Nouveau nom',p.name);if(n){p.name=n;save();peopleSheet()}}if(t.dataset.removePerson&&data.debts.some(x=>x.personId===t.dataset.removePerson)){toast('Impossible : ce créancier a des dettes')}else if(t.dataset.removePerson){data.people=data.people.filter(x=>x.id!==t.dataset.removePerson);save();peopleSheet()}if(t.dataset.delCat){data.categories=data.categories.filter(x=>x.id!==t.dataset.delCat);save();categoriesSheet()}});
$('#addDebt').onclick=e=>{e.preventDefault();setActiveTab(null);debtForm();};$('#addPayment').onclick=()=>paymentForm();$('#managePeople').onclick=peopleSheet;$('#settingsBtn').onclick=settings;$('#tabSettings').onclick=settings;$('#themeBtn').onclick=()=>{data.theme=document.body.classList.contains('dark')?'light':'dark';applyTheme();save()};$('#tabPay').onclick=()=>paymentForm();$('#tabDebts').onclick=()=>$('#search').focus();['search','personFilter','catFilter'].forEach(id=>$('#'+id).addEventListener('input',()=>render()));$('#clearFilters').onclick=()=>{['search','personFilter','catFilter'].forEach(id=>$('#'+id).value='');render()};applyTheme();render();
</script>
<script>
/* Motion, accessibility and backup enhancements; storage schema remains unchanged. */
const _baseRender=render; let _lastSnapshot={}; let _undo=null; let _knownSettled=null;
function numericText(el){return el?Number((el.textContent||'').replace(/[^0-9,.-]/g,'').replace(/\s/g,'').replace(',','.'))||0:0}
function tween(el,target,format=euro){
  if(!el)return;
  const finalText=()=>{try{el.textContent=format(Number(target)||0)}catch{el.textContent=String(target)}};
  try{
    const from=numericText(el), to=Number(target)||0;
    if(!Number.isFinite(from)||!Number.isFinite(to)||matchMedia('(prefers-reduced-motion: reduce)').matches){finalText();return}
    const start=performance.now(),dur=650;
    function tick(now){try{const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);el.textContent=format(from+(to-from)*e);if(t<1)requestAnimationFrame(tick);else finalText()}catch{finalText()}}
    requestAnimationFrame(tick)
  }catch{finalText()}
}
function countFormat(n){return Number.isInteger(n)?String(Math.round(n)):String(Math.round(n))}
function animateTotals(){tween($('#total'),sum(data.debts));tween($('#paid'),allPaid());tween($('#remaining'),Math.max(0,sum(data.debts)-allPaid()));tween($('#ops'),data.debts.length+data.payments.length,countFormat);tween($('#donutTotal'),sum(filtered().slice(0,5).map(d=>Number(d.amount)||0)))}
function observeCards(){
  const nodes=document.querySelectorAll('.card,.debt,.activity,.empty');
  nodes.forEach((x,i)=>{x.classList.add('reveal','in');x.style.transitionDelay=Math.min(i*35,240)+'ms'});
  if(!('IntersectionObserver' in window))return;
  try{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});nodes.forEach(x=>io.observe(x))}catch{}
}
render=function(){const before=_knownSettled;_baseRender();const now=new Set(data.debts.filter(d=>debtLeft(d)<=0).map(d=>d.id));if(before){now.forEach(id=>{if(!before.has(id))celebrate()})}_knownSettled=now;animateTotals();observeCards();document.querySelectorAll('button,.fab,.link').forEach(b=>b.classList.add('pressable'))}
function celebrate(){const colors=['#E46A3F','#238B78','#E5AA4C','#8B78CE','#fff'];for(let i=0;i<26;i++){const c=document.createElement('i');c.className='confetti';c.style.left='50%';c.style.top='32%';c.style.background=colors[i%colors.length];c.style.setProperty('--x',(Math.random()*260-130)+'px');c.style.setProperty('--y',(Math.random()*300-150)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),1000)}}
function toast(s,undo){const t=$('#toast');t.innerHTML=undo?s+' <button style="background:none;color:var(--accent2);font-weight:800;margin-left:8px">Annuler</button>':s;t.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.remove('show'),undo?5000:2200);if(undo)t.querySelector('button').onclick=()=>{if(_undo){_undo();_undo=null}t.classList.remove('show');render()}}
// visual touch feedback
 document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;const r=document.createElement('i');r.className='ripple';const q=b.getBoundingClientRect(),z=Math.max(q.width,q.height);r.style.width=r.style.height=z+'px';r.style.left=(e.clientX-q.left-z/2)+'px';r.style.top=(e.clientY-q.top-z/2)+'px';b.style.position='relative';b.style.overflow='hidden';b.appendChild(r);setTimeout(()=>r.remove(),600)},{passive:true});
// replace destructive delete handling with animated collapse + undo
const _oldClick=document.querySelector; // keep existing handler and add capture before it
 document.addEventListener('click',e=>{const t=e.target;if(!t.dataset.del||!confirm('Supprimer cette dette ?'))return;e.stopImmediatePropagation();const id=t.dataset.del,d=data.debts.find(x=>x.id===id);if(!d)return;const payments=data.payments.filter(x=>x.debtId===id), card=t.closest('.debt');if(card)card.classList.add('removing');setTimeout(()=>{data.debts=data.debts.filter(x=>x.id!==id);data.payments=data.payments.filter(x=>x.debtId!==id);_undo=()=>{data.debts.push(d);data.payments.push(...payments);save()};save();toast('Dette supprimée ·',true)},280)},{capture:true});
// export/import with validation, share support and last-backup date (stored inside existing object)
function validPayload(x){return x&&Array.isArray(x.people)&&Array.isArray(x.categories)&&Array.isArray(x.debts)&&Array.isArray(x.payments)&&(!x.debts.some(d=>!d||typeof d.id!=='string'||!isFinite(Number(d.amount))))}
async function exportData(){const payload=JSON.stringify(data,null,2),blob=new Blob([payload],{type:'application/json'}),file=new File([blob],'dette-claire.json',{type:'application/json'});data.lastBackup=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'Dette claire',files:[file]});toast('Sauvegarde partagée');return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dette-claire.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sauvegarde téléchargée')}
function importFile(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!validPayload(x))throw Error();if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){data={...starter,...x};save();closeSheet();toast('Données importées')}}catch{toast('Fichier JSON invalide')}};r.readAsText(file)}
// modal swipe-to-dismiss
let sy=0;$('#sheetBack').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});$('#sheetBack').addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-sy;if(dy>0)$('#sheetBack').classList.add('dragging'),$('#sheetBack .sheet').style.transform=`translateY(${dy}px)`},{passive:true});$('#sheetBack').addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-sy;$('#sheetBack').classList.remove('dragging');$('#sheetBack .sheet').style.transform='';if(dy>90)closeSheet()});
// active-tab indicator and same-page transitions
function setActiveTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===id || (!id && !x.id)));}
setActiveTab(null);
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>setActiveTab(tab.id||null)));
// patch settings buttons after every settings sheet creation
const _settings=settings;settings=function(){_settings();const ex=$('#export'),im=$('#import'),file=$('#file');if(ex)ex.onclick=exportData;if(im)im.onclick=()=>file.click();if(file)file.onchange=e=>{if(e.target.files[0])importFile(e.target.files[0])};};$('#settingsBtn').onclick=settings;$('#tabSettings').onclick=settings;
render();
</script>
